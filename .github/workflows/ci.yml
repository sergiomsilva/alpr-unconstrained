name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  syntax-and-unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python \${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python-version }}

      - name: Install lightweight deps (skip heavy DL frameworks)
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy opencv-python-headless flask werkzeug tomli

      - name: Compile check all scripts
        run: |
          python -m compileall -q . -x 'darknet|samples|\.idea'

      - name: Run smoke tests (no model weights needed)
        env:
          SKIP_HEAVY_IMPORTS: '1'
        run: pytest tests/ -v -k "compile or pyproject"

      - name: Full unit tests (import-level, may skip heavy deps)
        run: pytest tests/ -v || true
